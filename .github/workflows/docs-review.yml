name: Docs Review

# Runs the docs-review plugin (kalt-ai-plugins marketplace) on every PR into main:
# /docs-review:release-gate = this repo's checks + security-review + content-safety.
# Repo-specific rules: .claude/review-rules.md.
#
# This repo is PUBLIC. The job runs on a self-hosted runner with AWS access, so it only runs
# for PRs from branches of this repo, never from forks (PR code from a fork must not reach it).
#
# GATE_MODE=report: posts the findings as a PR comment and never fails on them.
# Switch to "block" once the findings are trusted, then make this a required check.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GATE_MODE: report

jobs:
  docs-review:
    # Same-repo PRs only: never run fork code on the self-hosted runner.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    # The claude-code action needs AWS access (LiteLLM key in Parameter Store) and ACCESS_TOKEN
    # (plugin marketplace) from the runner, as in the microservices' docs-quality job.
    runs-on: codebuild-ovp-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release gate
        id: review
        continue-on-error: true
        timeout-minutes: 25
        uses: kaltura/ovp-pipelines/.github/actions/claude-code@v4
        with:
          prompt: >-
            Run /docs-review:release-gate --ci
            --base origin/${{ github.base_ref }} --head ${{ github.event.pull_request.head.sha }}
            --output ${{ runner.temp }}/docs-review.json on this repository.
            This is an unattended CI run: never ask questions, and do not commit, push or create branches.
          # safe: the skills write only the report file. The comment and the gate below read that file.
          mode: safe
          deny-list: no-push,no-commit,no-branch-creation

      - name: Summarize report
        id: report
        if: ${{ !cancelled() }}
        env:
          REPORT: ${{ runner.temp }}/docs-review.json
          BODY: ${{ runner.temp }}/docs-review.md
        run: |
          if ! jq -e 'has("verdict") and (.findings | type == "array")' "$REPORT" >/dev/null 2>&1; then
            echo "::error::docs-review did not produce a valid report at $REPORT"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERDICT="$(jq -r .verdict "$REPORT")"
          {
            echo "<!-- docs-review -->"
            echo "## Docs review: \`${VERDICT}\`"
            echo
            jq -r '"high \(.counts.high // 0) · medium \(.counts.medium // 0) · low \(.counts.low // 0) · info \(.counts.info // 0)"' "$REPORT"
            echo
            jq -r 'if (.findings | length) == 0 then "No findings."
                   else (.findings | sort_by({"high":0,"medium":1,"low":2,"info":3}[.severity]) | .[]
                     | "- **\(.severity)** `\(.id)` \(.file // "")\(if .line then ":\(.line)" else "" end) — \(.summary)\n  - Scenario: \(.scenario // "-")\n  - Fix: \(.fix // "-")")
                   end' "$REPORT"
            echo
            echo "<details><summary>Checked / not checked</summary>"
            echo
            jq -r '(.checked // [])[] | "- ✓ \(.)"' "$REPORT"
            jq -r '(.notChecked // [])[] | "- ✗ \(.)"' "$REPORT"
            echo
            echo "</details>"
            echo
            echo "_Automated by \`/docs-review:release-gate\` (gate mode: \`${GATE_MODE}\`). Rules: \`.claude/review-rules.md\`._"
          } > "$BODY"
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: ${{ !cancelled() && steps.report.outputs.valid == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ runner.temp }}/docs-review.md
        run: |
          # One comment per PR, updated on every run.
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- docs-review -->")) | .id' | head -1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -F body=@"$BODY" > /dev/null
          else
            gh pr comment "$PR" --body-file "$BODY"
          fi

      - name: Gate
        if: ${{ !cancelled() }}
        env:
          VALID: ${{ steps.report.outputs.valid }}
          VERDICT: ${{ steps.report.outputs.verdict }}
        run: |
          if [ "$VALID" != "true" ]; then
            echo "::warning::No valid docs-review report (the review step failed or timed out)."
            [ "$GATE_MODE" = "block" ] && exit 1 || exit 0
          fi
          echo "Verdict: $VERDICT (gate mode: $GATE_MODE)"
          if [ "$GATE_MODE" = "block" ] && [ "$VERDICT" = "fail" ]; then
            echo "::error::docs-review found blocking issues. See the PR comment."
            exit 1
          fi
