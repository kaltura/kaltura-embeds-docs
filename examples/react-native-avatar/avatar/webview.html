<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Avatar</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #avatar-root { position: fixed; inset: 0; }
      /* headless only: fill the floating card with the video. contained lays out its own stage. */
      #avatar-root.headless video { width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="avatar-root"></div>
    <!-- crypto.randomUUID exists only in secure contexts. A WebView that loads this page over plain
         http (a LAN IP or 10.0.2.2 during development) lacks it, and the avatar runtime needs it.
         Polyfill it before the module runs. getRandomValues works in insecure contexts. -->
    <script>
      if (window.crypto && typeof crypto.randomUUID !== 'function') {
        crypto.randomUUID = function () {
          var b = crypto.getRandomValues(new Uint8Array(16));
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
          return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
        };
      }
    </script>
    <script type="module" src="./avatar.js"></script>
  </body>
</html>
